<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="pageTitle">Game Page</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <nav class="navbar">
      <img src="images/logo.png" class="logo">

      <ul class="nav-links">
        <li class="navbutton"><a href="Index.html">Home</a></li>
        <li class="navbutton"><a href="Index.html#Games">Games</a></li>
        <li class="navbutton"><a href="AboutMe.html">About Me</a></li>
        <li class="navbutton"><a href="Index.html#Contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <main class="content">
      <section id="gameHero" class="hero">
        <img id="image" class="hero-img" alt="">
        <div class="hero-copy">
          <h1 id="title"></h1>

          <div class="game-actions">
            <a id="playBtn" class="play-btn">Play</a>
          </div>
        </div>
      </section>

      <section id="overviewSection" class="GameInfo">
        <h2 id="overviewLabel">Game Overview</h2>
        <p id="description"></p>
      </section>

      <section id="gameplaySection" class="game-section">
        <h2 id="gameplayLabel">Gameplay</h2>
        <div id="gameplay" class="gameplay"></div>
      </section>

      <section id="featuresSection" class="game-section">
        <h2 id="featuresLabel">Features</h2>
        <ul id="features"></ul>
      </section>

      <section id="techSection" class="game-section">
        <h2 id="techLabel">Tech Stack</h2>
        <ul id="tech"></ul>
      </section>

      <section id="learnedSection" class="game-section">
        <h2 id="learnedLabel">What I Learned</h2>
        <ul id="learned"></ul>
      </section>

      <section id="futureSection" class="game-section">
        <h2 id="futureLabel">Future Improvements</h2>
        <p id="future"></p>
      </section>

      <a href="Index.html" class="back-btn">Back to Portfolio</a>
    </main>
  </div>

  <script type="module" src="game.js"></script>
</body>

</html>
